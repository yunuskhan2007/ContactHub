<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ContactHub</title>

    <link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/toast.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <nav class="nav-container">

            <a href="index.html" class="nav-logo">

                <span class="nav-logo-icon">
                    <i class="fa-solid fa-address-book"></i>
                </span>

                <span class="nav-logo-text">
                    ContactHub
                </span>

            </a>

            <div class="nav-actions">

                <a href="signup.html" class="btn btn-primary btn-small">
                    Sign Up
                </a>

            </div>

        </nav>

    </header>

    <!-- ================= LOGIN ================= -->

    <section class="auth-section">

        <div class="auth-container">

            <!-- LEFT -->

            <div class="auth-left">

                <p class="eyebrow">
                    Welcome Back
                </p>

                <h1>
                    Login to your <span class="text-accent">ContactHub</span>
                </h1>

                <p>
                    Access your contacts, organize relationships and continue
                    where you left off.
                </p>

                <div class="auth-image">

                    <i class="fa-solid fa-address-book"></i>

                </div>

            </div>

            <!-- RIGHT -->

            <div class="auth-card">

                <h2>Login</h2>

                <p>
                    Enter your credentials below.
                </p>

                <form action="#" id="loginForm">

                    <div class="input-group">

                        <label>Email Address</label>

                        <input
                            id="email"
                            type="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                   <div class="input-group">

    <label for="password">Password</label>

    <div class="password-box">

        <input
    type="password"
    id="password"
    name="password"
    autocomplete="current-password">

        <i
            id="togglePassword"
            class="fa-solid fa-eye"></i>

    </div>

</div>
                    <div class="form-options">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <button
                        type="submit"
                        id="loginBtn"
                        class="btn btn-primary btn-large login-btn">
                        Login
                    </button>

            

                </form>

                <div class="auth-footer">

                    Don't have an account?

                    <a href="signup.html">

                        Sign Up

                    </a>

                </div>

            </div>

        </div>

    </section>

    <script src="../js/toast.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
