<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | ContactHub</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/toast.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <nav class="nav-container">

            <a href="index.html" class="nav-logo">

                <span class="nav-logo-icon">
                    <i class="fa-solid fa-address-book"></i>
                </span>

                <span class="nav-logo-text">
                    ContactHub
                </span>

            </a>

            <div class="nav-actions">

                <a href="login.html" class="btn btn-ghost">
                    Login
                </a>

            </div>

        </nav>

    </header>

    <!-- ================= SIGNUP ================= -->

    <section class="auth-section">

        <div class="auth-container">

            <!-- LEFT -->

            <div class="auth-left">

                <p class="eyebrow">
                    Join ContactHub
                </p>

                <h1>
                    Create Your <span class="text-accent">Account</span>
                </h1>

                <p>
                    Start organizing your contacts in one secure place.
                    Fast, simple and built for everyday use.
                </p>

                <div class="auth-image">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

            </div>

            <!-- RIGHT -->

            <div class="auth-card">

                <h2>Create Account</h2>

                <p>
                    Fill in the details below.
                </p>

                <form id="signupForm">

                    <div class="input-group">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required>
                    </div>

                    <div class="input-group">

    <label for="password">Password</label>

    <div class="password-box">

        <input
    type="password"
    id="password"
    name="password"
    placeholder="Enter Password"
    autocomplete="new-password"
    spellcheck="false"
    autocorrect="off"
    autocapitalize="off">
        <i
            id="togglePassword"
            class="fa-solid fa-eye"></i>

    </div>

</div>

                    <div class="input-group">

    <label for="confirmPassword">Confirm Password</label>

    <div class="password-box">

       <input
    type="password"
    id="confirmPassword"
    name="confirmPassword"
    autocomplete="new-password">

        <i
            id="toggleConfirmPassword"
            class="fa-solid fa-eye"></i>

    </div>

</div>
                    <button
                        type="submit"
                        class="btn btn-primary btn-large login-btn">

                        Create Account

                    </button>

                </form>

                <div class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </section>

    <script src="../js/auth.js"></script>
    <script src="../js/toast.js"></script>

</body>

</html>
